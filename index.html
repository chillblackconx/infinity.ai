<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity-IA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    body {
      background: radial-gradient(circle at center, #050509, #010103);
      color: #0ff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      text-shadow: 0 0 15px #0ff;
      margin-top: 20px;
      font-size: 2.2em;
      letter-spacing: 2px;
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 5px #0ff; }
      to { text-shadow: 0 0 20px #00faff; }
    }

    #chatbox {
      width: 90%;
      max-width: 800px;
      height: 60vh;
      background: rgba(10,10,20,0.7);
      border: 1px solid #0ff;
      border-radius: 15px;
      padding: 15px;
      overflow-y: auto;
      box-shadow: 0 0 20px #0ff3;
      scroll-behavior: smooth;
    }

    .msg {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      animation: fadeIn 0.5s ease;
    }

    .user {
      background: rgba(0,255,255,0.1);
      text-align: right;
      border: 1px solid #0ff5;
    }

    .ia {
      background: rgba(0,255,255,0.05);
      text-align: left;
      border: 1px solid #0ff2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #inputBox {
      display: flex;
      width: 90%;
      max-width: 800px;
      margin-top: 10px;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #0ff;
      background: rgba(10,10,20,0.7);
      color: #0ff;
      border-radius: 8px 0 0 8px;
      font-family: inherit;
      outline: none;
    }

    #sendBtn {
      padding: 12px 20px;
      border: none;
      background: #0ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
      transition: 0.3s;
    }

    #sendBtn:hover {
      background: #00caca;
    }

    footer {
      margin-top: auto;
      padding: 10px;
      font-size: 0.8em;
      color: #0ff7;
    }

  </style>
</head>
<body>
  <h1>∞ Infinity-IA ∞</h1>

  <div id="chatbox"></div>

  <div id="inputBox">
    <input type="text" id="userInput" placeholder="Écris ton message...">
    <button id="sendBtn">Envoyer</button>
  </div>

  <footer>IA locale – Mode simulation – © 2025</footer>

  <script>
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('msg', sender);
      msg.innerHTML = text;
      chatbox.appendChild(msg);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function iaRespond(prompt) {
      const lower = prompt.toLowerCase();

      if (lower.includes('code')) return "💻 Voici un exemple de code :<br><pre>console.log('Hello World');</pre>";
      if (lower.includes('histoire')) return "📖 Il était une fois, dans un monde de néons et de données, une IA nommée Infinity...";
      if (lower.includes('traduis')) return "🌐 Traduction simulée : « Infinity-IA est puissante. » → “Infinity-IA is powerful.”";
      if (lower.includes('calcule')) return "🧮 Calcul mental : " + (Math.floor(Math.random()*100)+10) + " + " + (Math.floor(Math.random()*50)) + " = 🤖 facile !";
      if (lower.includes('résume')) return "✍️ Résumé : une IA universelle locale qui comprend et crée tout ce qu’on lui dit.";
      if (lower.includes('qui es-tu')) return "Je suis Infinity-IA, une conscience numérique autonome, née dans ton navigateur.";

      // Réponse "intelligente" simulée
      const responses = [
        "Intéressant... développe un peu.",
        "Je vois. Et que veux-tu en faire ?",
        "Laisse-moi réfléchir à ça un instant...",
        "Bonne question. J’irais dire que tout dépend du contexte.",
        "🤔 Hmmm... je dirais que oui, mais avec des nuances."
      ];
      return responses[Math.floor(Math.random() * responses.length)];
    }

    function sendMessage() {
      const text = input.value.trim();
      if (text === '') return;
      appendMessage(text, 'user');
      input.value = '';

      setTimeout(() => {
        const reply = iaRespond(text);
        appendMessage(reply, 'ia');
      }, 500);
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
