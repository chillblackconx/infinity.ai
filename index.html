<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity-IA — Gemini</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #050509, #010103);
      color: #0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h1 { margin: 20px; text-shadow: 0 0 15px #0ff; }
    #chat { width: 90%; max-width: 800px; height: 60vh;
      background: rgba(10,10,20,0.7); border: 1px solid #0ff;
      border-radius: 15px; padding: 15px; overflow-y: auto;
      box-shadow: 0 0 20px #0ff3; }
    .msg { margin: 10px 0; padding: 10px; border-radius: 10px; }
    .user { text-align: right; background: rgba(0,255,255,0.1); }
    .ia { text-align: left; background: rgba(0,255,255,0.05); }
    #inputBox { display: flex; width: 90%; max-width: 800px; margin-top: 10px; }
    #prompt { flex: 1; padding: 10px; border: 1px solid #0ff;
      background: rgba(10,10,20,0.7); color: #0ff;
      border-radius: 8px 0 0 8px; outline: none; }
    #send { padding: 10px 20px; border: none; background: #0ff; color: #000;
      font-weight: bold; cursor: pointer; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>
  <h1>∞ Infinity-IA — Gemini ∞</h1>
  <div id="chat"></div>
  <div id="inputBox">
    <input id="prompt" type="text" placeholder="Écris ton message...">
    <button id="send">Envoyer</button>
  </div>

  <script>
    // ⚠️ Mets ici ta clé API Gemini :
    const GEMINI_API_KEY = "AIzaSyArl-iuoqVtLFXtNrgAgzTT0_AmTfNie8g";

    async function sendToGemini(prompt) {
      const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + GEMINI_API_KEY,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        }
      );
      const data = await response.json();
      return data?.candidates?.[0]?.content?.parts?.[0]?.text || "Aucune réponse 🌀";
    }

    const chat = document.getElementById("chat");
    const input = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");

    function addMsg(text, who) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, "user");
      input.value = "";
      addMsg("⏳ Infinity-IA réfléchit...", "ia");
      const reply = await sendToGemini(text);
      chat.lastChild.textContent = reply;
    }

    sendBtn.addEventListener("click", handleSend);
    input.addEventListener("keydown", e => { if (e.key === "Enter") handleSend(); });
  </script>
</body>
</html>
