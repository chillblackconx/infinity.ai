<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>∞ Infinity-IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

  body {
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at center, #050509, #010103);
    color: #0ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    min-height: 100vh;
  }

  h1 {
    text-shadow: 0 0 15px #0ff;
    font-size: 3em;
  }

  textarea {
    width: 80%;
    max-width: 600px;
    height: 120px;
    background: #111;
    color: #0ff;
    border: 1px solid #0ff;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    margin-top: 20px;
    resize: none;
  }

  button {
    margin-top: 20px;
    padding: 10px 25px;
    border-radius: 10px;
    border: none;
    background: #0ff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
  }

  #response {
    margin-top: 30px;
    background: #111;
    border: 1px solid #0ff;
    border-radius: 10px;
    padding: 20px;
    width: 80%;
    max-width: 600px;
    white-space: pre-wrap;
    min-height: 100px;
  }
</style>
</head>
<body>
<h1>∞ Infinity-IA</h1>

<textarea id="input" placeholder="Écris ton message ici..."></textarea>
<button onclick="sendToAI()">Envoyer</button>

<div id="response">💬 Les réponses apparaîtront ici...</div>

<script>
async function sendToAI() {
  const input = document.getElementById("input").value.trim();
  const resDiv = document.getElementById("response");
  if (!input) return;

  resDiv.innerText = "💬 Infinity-IA réfléchit...";

  try {
    const res = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: input }] }]
      }),
    });

    const data = await res.json();
    const output = data?.candidates?.[0]?.content?.parts?.[0]?.text || "❌ Aucune réponse";
    resDiv.innerText = output;
  } catch(e) {
    resDiv.innerText = "⚠️ Erreur de connexion au serveur";
  }
}
</script>
</body>
</html>
